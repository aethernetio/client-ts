          seconds: int

  # === Registration API (перенесено из ClientServerRegApi) ===

  ClientApiRegUnsafe:
    methods:
      enter:
        id: 3
        params:
          stream:
            name: ClientApiRegSafeStream
            stream:
              api: ClientApiRegSafe
              crypto: true
      enterGlobal:
        id: 4
        params:
          stream:
            name: GlobalRegClientApiStream
            stream:
              api: GlobalRegClientApi
              crypto: true

  GlobalRegServerApi:
    methods:
      setMasterKey:
        id: 3
        params:
          key: Key
      finish:
        id: 4
        returns:
          fields:
            alias: uuid
            uid: uuid
            cloud: Cloud

  ServerRegistrationApi:
    methods:
      registration:
        id: 3
        params:
          salt: string
          suffix: string
          passwords: int[]
          parent: uuid
          globalApi:
            name: GlobalApiStream
            stream:
              api: GlobalRegServerApi
              crypto: true
      requestWorkProofData:
        id: 4
        returns: WorkProofDTO
        params:
          parent: uuid
          powMethods: PowMethod
      resolveServers:
        id: 5
        returns: ServerDescriptor[]
        params:
          serverIds: Cloud
      setReturnKey:
        id: 6
        params:
          key: Key

  RegistrationRootApi:
    methods:
      getAsymmetricPublicKey:
        id: 3
        returns: SignedKey
        params:
          cryptoLib: CryptoLib
      enter:
        id: 4
        params:
          cryptoLib: CryptoLib
          stream:
            name: ServerRegistrationApiStream
            stream:
              api: ServerRegistrationApi
              crypto: true
      getMyIp:
        id: 6
        returns: IpInfo

  ClientApiRegSafe:

  GlobalRegClientApi: