name: Final live network probe validation

on:
  push:
    branches:
      - network-probe-live-prototype-20260902
    paths:
      - '.github/workflows/final-live-probe-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: network-probe-live-prototype-20260902

      - name: Install dependencies and browser runner
        run: |
          npm ci
          npm install --no-save puppeteer-core@24.16.0

      - name: Compile TypeScript
        run: npm run build

      - name: Run complete Jest suite
        run: npm test -- --runInBand

      - name: Build universal and probe with stats
        run: |
          mkdir -p final-validation build/production
          npx webpack --config webpack.config.mjs --env buildTarget=browser --profile --json=final-validation/universal-stats.json
          cp build/browser/aether-client.min.js final-validation/universal.js
          npx webpack --config webpack.network-probe.config.mjs --profile --json=final-validation/probe-stats.json
          cp build/network-probe/aether-network-probe.min.js final-validation/probe-main.js

      - name: Fetch exact current website production client
        run: |
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/aethernetio/main-site/main/aether-client.min.js \
            -o build/production/aether-client.min.js
          wc -c build/production/aether-client.min.js
          test "$(wc -c < build/production/aether-client.min.js)" -eq 1334301

      - name: Recheck dependency isolation and size
        run: |
          python3 - <<'PY'
          import gzip,json
          from pathlib import Path
          root=Path('final-validation')
          stats=json.loads((root/'probe-stats.json').read_text())
          universal=(root/'universal.js').read_bytes()
          probe=(root/'probe-main.js').read_bytes()
          entry=stats.get('entrypoints',{}).get('browser',{})
          entry_chunks=set(entry.get('chunks') or [])
          initial=[]; all_names=[]
          def walk(m):
              children=m.get('modules') or []
              if children:
                  for c in children: walk(c)
                  return
              name=m.get('name') or m.get('identifier') or ''
              all_names.append(name)
              if set(m.get('chunks') or []) & entry_chunks: initial.append(name)
          for m in stats.get('modules') or []: walk(m)
          forbidden={
              'fullClient':'aether_client.ts',
              'oldWork':'aether_client_connection_work.ts',
              'messageNode':'aether_client_message',
              'webrtc':'aether_fastmeta_webrtc',
              'sodium':'node_modules/libsodium/',
              'sodiumWrappers':'libsodium-wrappers',
              'bcrypt':'bcryptjs',
          }
          leaks={k:any(token in n for n in initial) for k,token in forbidden.items()}
          assets=[]
          for p in sorted(Path('build/network-probe').glob('*.js')):
              data=p.read_bytes()
              assets.append({'name':p.name,'bytes':len(data),'gzip9Bytes':len(gzip.compress(data,9))})
          report={
              'universalBytes':len(universal),
              'universalGzip9Bytes':len(gzip.compress(universal,9)),
              'probeMainBytes':len(probe),
              'probeMainGzip9Bytes':len(gzip.compress(probe,9)),
              'probeAssets':assets,
              'forbiddenInitialDependencies':leaks,
              'deferredSodium':any('libsodium' in n for n in all_names),
              'deferredRegistration':any('aether_network_probe_connection_registration' in n for n in all_names),
          }
          print(json.dumps(report,indent=2))
          (root/'static-summary.json').write_text(json.dumps(report,indent=2))
          if len(universal)!=1376158: raise SystemExit('Universal browser build changed')
          if any(leaks.values()): raise SystemExit('Forbidden dependency leaked into initial probe chunk')
          if not report['deferredSodium'] or not report['deferredRegistration']:
              raise SystemExit('Deferred crypto/registration chunks missing')
          if len(probe)>=len(universal): raise SystemExit('Probe main bundle is not smaller')
          PY

      - name: Run production state compatibility and soak tests
        run: |
          node scripts/run-network-probe-compat-soak.mjs final-validation/compat-soak.json

      - name: Upload final validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-live-network-probe-validation
          path: final-validation
          if-no-files-found: warn
