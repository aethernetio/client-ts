name: Validate network probe test kit

on:
  push:
    branches:
      - browser-lite-analysis-20260902
    paths:
      - '.github/workflows/validate-network-probe-test-kit.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Compile TypeScript
        run: npm run build
      - name: Check benchmark script syntax
        run: |
          node --check scripts/run-network-probe-benchmark.mjs
          node --check bench/network-probe/harness.js
      - name: Run probe contract test
        run: npx jest test/network_probe_contract.test.ts --runInBand
      - name: Build browser bundles
        run: |
          npx webpack --config webpack.config.mjs --env buildTarget=browser
          npx webpack --config webpack.network-probe.config.mjs
      - name: Assert foundation remains lightweight
        run: |
          node - <<'JS'
          const fs=require('fs'),zlib=require('zlib');
          const files={
            universal:'build/browser/aether-client.min.js',
            probe:'build/network-probe/aether-network-probe.min.js'
          };
          const out={};
          for(const [k,p] of Object.entries(files)){
            const b=fs.readFileSync(p);
            out[k]={bytes:b.length,gzip9:zlib.gzipSync(b,{level:9}).length};
          }
          console.log(out);
          if(out.universal.bytes!==1376158) throw new Error('Universal bundle changed unexpectedly');
          if(out.probe.bytes>550000 || out.probe.gzip9>65000) throw new Error('Probe foundation size regression');
          JS
