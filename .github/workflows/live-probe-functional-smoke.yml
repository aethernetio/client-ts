name: Live network probe functional smoke

on:
  push:
    branches:
      - network-probe-live-prototype-20260902
    paths:
      - '.github/workflows/live-probe-functional-smoke.yml'

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: network-probe-live-prototype-20260902

      - name: Install dependencies and browser runner
        run: |
          npm ci
          npm install --no-save puppeteer-core@24.16.0

      - name: Build universal and probe
        run: |
          npx webpack --config webpack.config.mjs --env buildTarget=browser
          npx webpack --config webpack.network-probe.config.mjs

      - name: Run one cold warm pair for both clients
        run: |
          node scripts/run-network-probe-benchmark.mjs \
            --variant=both \
            --runs=1 \
            --cpu=1 \
            --mode=both \
            --allow-not-ready=false \
            --output=live-probe-functional-smoke.json

      - name: Assert live parity
        if: success()
        run: |
          node - <<'JS'
          const report=require('./live-probe-functional-smoke.json');
          const probe=report.samples.filter(x=>x.variant==='probe' && x.status==='ok');
          if(probe.length!==2) throw new Error(`Expected cold+warm probe samples, got ${probe.length}`);
          for(const sample of probe){
            if(!sample.myIpReceived) throw new Error('Probe did not receive public IP');
            if(!(sample.serverCount>0)) throw new Error('Probe returned no servers');
            if(!(sample.pingSuccessCount>0)) throw new Error('Probe completed no successful ping');
            if(!Number.isFinite(sample.firstWorkConnectionMs)) throw new Error('No writable WORK connection timing');
          }
          console.log(JSON.stringify(report.summary,null,2));
          JS

      - name: Upload live smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-network-probe-functional-smoke
          path: live-probe-functional-smoke.json
          if-no-files-found: warn
