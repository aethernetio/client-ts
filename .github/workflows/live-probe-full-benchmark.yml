name: Full live network probe benchmark

on:
  push:
    branches:
      - network-probe-live-prototype-20260902
    paths:
      - '.github/workflows/live-probe-full-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: network-probe-live-prototype-20260902

      - name: Install dependencies and browser runner
        run: |
          npm ci
          npm install --no-save puppeteer-core@24.16.0

      - name: Build universal and probe
        run: |
          npx webpack --config webpack.config.mjs --env buildTarget=browser
          npx webpack --config webpack.network-probe.config.mjs

      - name: Run 5 cold warm pairs at CPU 1x and 4x
        run: |
          node scripts/run-network-probe-benchmark.mjs \
            --variant=both \
            --runs=5 \
            --cpu=1,4 \
            --mode=both \
            --allow-not-ready=false \
            --output=live-probe-full-benchmark.json

      - name: Assert complete sample matrix
        if: success()
        run: |
          node - <<'JS'
          const r=require('./live-probe-full-benchmark.json');
          const expected=40;
          if(r.samples.length!==expected) throw new Error(`Expected ${expected} samples, got ${r.samples.length}`);
          const errors=r.samples.filter(x=>x.status!=='ok');
          if(errors.length) throw new Error(`Benchmark contains ${errors.length} failed samples`);
          for(const v of ['universal','probe']) for(const cpu of [1,4]) for(const cold of [true,false]){
            const s=r.samples.filter(x=>x.variant===v && x.cpuRate===cpu && x.cold===cold);
            if(s.length!==5) throw new Error(`Missing samples for ${v} cpu${cpu} ${cold?'cold':'warm'}: ${s.length}`);
            if(s.some(x=>!x.myIpReceived || x.serverCount<=0 || x.pingSuccessCount<=0)) throw new Error(`Functional parity failure in ${v} cpu${cpu} ${cold?'cold':'warm'}`);
          }
          console.log(JSON.stringify(r.summary,null,2));
          JS

      - name: Upload full benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-network-probe-full-benchmark
          path: live-probe-full-benchmark.json
          if-no-files-found: warn
