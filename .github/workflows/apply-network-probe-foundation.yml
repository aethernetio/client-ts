name: Apply network probe foundation

on:
  push:
    branches:
      - browser-lite-analysis-20260902
    paths:
      - '.github/workflows/apply-network-probe-foundation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: browser-lite-analysis-20260902
          fetch-depth: 1

      - name: Apply lightweight protocol runtime foundation
        shell: bash
        run: |
          set -euo pipefail

          cat > src/aether_protocol_runtime.ts <<'TS'
          /**
           * Internal runtime surface used by generated protocol code.
           *
           * Keep this deliberately narrow. Generated DTO/API code needs the
           * serialization/future/type runtime, but must not depend on the full
           * AetherCloudClient barrel because that pulls crypto, messaging and
           * WebRTC into protocol-only browser bundles.
           */
          export * from './aether_future';
          export * from './aether_datainout';
          export * from './aether_fastmeta';
          export * from './aether_types';
          export * from './aether_astring';
          TS

          python3 - <<'PY'
          from pathlib import Path

          # Make regeneration preserve the narrow internal runtime dependency.
          p = Path('generator/aether_protocol_generator.ts')
          s = p.read_text(encoding='utf-8')
          old = "this.importPrefix = './aether_client';"
          new = "this.importPrefix = './aether_protocol_runtime';"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Unexpected generator importPrefix state')
          p.write_text(s, encoding='utf-8')

          # Align the currently generated files with what the fixed generator
          # will produce on the next real ADSL regeneration.
          api = Path('src/aether_api.ts')
          s = api.read_text(encoding='utf-8')
          marker = "import * as Impl from './aether_api_impl';"
          i = s.find(marker)
          if i < 0:
              raise SystemExit('aether_api implementation import marker missing')
          runtime_import = """import {
              AFuture, ARFuture, DataInOutStatic, DataInOut,
              FastMetaType, FastMeta, SerializerPackNumber, DeserializerPackNumber,
              FastFutureContextStub, SyncMapChannel, MetaContext, RemoteApi,
              FastMetaApi, BytesConverter, UUID, URI, AConsumer, ToString,
              FastMetaHierarchyType, AString,
          } from './aether_protocol_runtime';
          """
          api.write_text(runtime_import + s[i:], encoding='utf-8')

          impl = Path('src/aether_api_impl.ts')
          s = impl.read_text(encoding='utf-8')
          # Preserve the generated import from ./aether_api and everything after it.
          marker = "import  {\n    AetherCodec"
          i = s.find(marker)
          if i < 0:
              marker = "import {\n    AetherCodec"
              i = s.find(marker)
          if i < 0:
              raise SystemExit('aether_api_impl generated API import marker missing')
          runtime_import = """import {
              AFuture, ARFuture, DataIn, DataOut, DataInOut, DataInOutStatic,
              FastMetaType, MetaContext, FastMeta, SerializerPackNumber,
              DeserializerPackNumber, RemoteApi, FastMetaApi, FastFutureContextStub,
              SecurityConnectionDropException, AetherException, UUID, URI, AString,
              BytesConverter,
          } from './aether_protocol_runtime';
          """
          impl.write_text(runtime_import + s[i:], encoding='utf-8')

          # URI is a TypeScript type alias, not a runtime JS export.
          probe = Path('src/aether_browser_protocol_probe.ts')
          s = probe.read_text(encoding='utf-8')
          s = s.replace("export { UUID, URI } from './aether_types';", "export { UUID } from './aether_types';\nexport type { URI } from './aether_types';")
          probe.write_text(s, encoding='utf-8')
          PY

      - name: Add next-test contract and build entry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs test

          cat > src/aether_network_probe_contract.ts <<'TS'
          import type {
              IpInfo,
              ServerDescriptor,
              ServerDescriptorWithGeo,
          } from './aether_api';

          /**
           * Experimental browser-only contract for the lightweight network probe.
           * This is intentionally not exported from the normal aether-client barrel.
           */
          export const NETWORK_PROBE_IMPLEMENTATION_STAGE = 'foundation' as const;

          export interface NetworkProbeStageTimings {
              stateRestoreMs: number;
              connectMs: number;
              serverListMs: number;
              myIpMs: number;
              firstWorkConnectionMs: number;
              firstPingMs: number;
              allPingsMs: number;
          }

          export interface NetworkProbeSnapshot {
              knownServers: readonly ServerDescriptor[];
              servers: readonly ServerDescriptorWithGeo[];
              myIp: IpInfo | null;
              pingMsBySid: Readonly<Record<number, number>>;
          }

          /**
           * Browser-facing shape the real AetherNetworkProbeClient must satisfy.
           * Promise methods keep the benchmark adapter independent of AFuture internals.
           */
          export interface AetherNetworkProbeClientContract {
              connect(): Promise<void>;
              getKnownServerDescriptors(): readonly ServerDescriptor[];
              getServers(): Promise<readonly ServerDescriptorWithGeo[]>;
              getMyIp(): Promise<IpInfo>;
              connectServers(descriptors: readonly ServerDescriptor[]): Promise<void>;
              measureServerPingMs(sid: number): Promise<number>;
              destroy(): Promise<void>;
          }
          TS

          cat > src/aether_browser_network_probe.ts <<'TS'
          /**
           * Browser entry reserved for the lightweight network-probe implementation.
           * At the foundation stage it exposes only the test contract and protocol
           * types, giving us a measured lower bound before transport/crypto are added.
           */
          export { NETWORK_PROBE_IMPLEMENTATION_STAGE } from './aether_network_probe_contract';
          export type {
              AetherNetworkProbeClientContract,
              NetworkProbeSnapshot,
              NetworkProbeStageTimings,
          } from './aether_network_probe_contract';

          export {
              AetherCodec,
              CryptoLib,
              ServerDescriptor,
              ServerDescriptorWithGeo,
              IpInfo,
              Cloud,
              LoginApi,
              LoginStream,
              AuthorizedApi,
              ClientApiSafe,
              ClientApiUnsafe,
          } from './aether_api';
          export { UUID } from './aether_types';
          export type { URI } from './aether_types';
          TS

          cat > webpack.network-probe.config.mjs <<'JS'
          import { resolve } from 'path';
          import { fileURLToPath } from 'url';
          import { dirname } from 'path';
          import baseFactory from './webpack.config.mjs';

          const __filename = fileURLToPath(import.meta.url);
          const __dirname = dirname(__filename);

          export default async () => {
            const base = await baseFactory({ buildTarget: 'browser' });
            return {
              ...base,
              entry: { browser: './src/aether_browser_network_probe.ts' },
              output: {
                ...base.output,
                path: resolve(__dirname, 'build/network-probe'),
                filename: 'aether-network-probe.min.js',
                clean: true,
                library: { name: 'AetherNetworkProbe', type: 'window' }
              }
            };
          };
          JS

          cat > test/network_probe_contract.test.ts <<'TS'
          import { NETWORK_PROBE_IMPLEMENTATION_STAGE } from '../src/aether_network_probe_contract';

          describe('network probe foundation', () => {
              it('stays explicitly in foundation stage until a real network client is added', () => {
                  expect(NETWORK_PROBE_IMPLEMENTATION_STAGE).toBe('foundation');
              });
          });
          TS

          cat > docs/network-probe-test-plan.md <<'MD'
          # AetherNetworkProbeClient browser test plan

          ## Goal
          Build a browser-only network-observation client that can perform the website use case without importing the full `AetherCloudClient` feature surface.

          The implementation must keep the existing wire protocol, generated protocol metadata, persisted client state format and Sodium cryptographic behavior. The experiment is about dependency and startup isolation, not a protocol or security redesign.

          ## Required functional path
          The first live implementation must support exactly the operations needed by the browser network observer:

          1. Restore existing browser client state or perform first registration when state is empty.
          2. Establish a working Æthernet connection.
          3. Return cached server descriptors immediately when available.
          4. Refresh the authoritative server list.
          5. Obtain the browser public IP through the existing Æthernet API.
          6. Start work-server transports in parallel.
          7. Measure RTT for each selected WORK server.
          8. Persist state needed for the warm-start path.
          9. Cleanly destroy transports/timers.

          ## Dependencies that must not enter the first probe implementation
          - `AetherCloudClient` itself
          - `aether_client_message`
          - WebRTC / `aether_fastmeta_webrtc`
          - access-group and client-to-client messaging behavior unless the login protocol proves it is strictly required

          Crypto/state/registration/work-connection modules may be reused where they are protocol requirements. Their cost must be measured rather than hidden.

          ## Comparative benchmark
          Compare the production-style universal browser client against the network probe using the same environment and state lifecycle.

          Run at least 5 cold and 5 warm samples at normal CPU and 4x CPU throttling. Record:

          - bundle raw and gzip bytes
          - script download + parse/evaluate time
          - Sodium readiness time
          - state restore time
          - `connect()` time
          - `getServers()` time
          - `getMyIp()` time
          - first writable WORK connection
          - first successful ping
          - all selected server pings complete
          - long-task count and total long-task duration

          ## Functional acceptance gate
          A probe result is valid only if it reaches the same live Æthernet network data as the universal client: usable UID/state, authoritative server list, public IP response, writable WORK transport and successful ping measurements. A size win without this parity does not count.

          ## Performance gate
          The probe must be materially smaller than the universal browser bundle and must not regress median cold/warm network startup. Do not choose a final production threshold until the first real probe result shows how much of the remaining cost is mandatory Sodium + wire protocol runtime.

          ## Current measured floor
          Before transport and crypto are added, the decoupled protocol/runtime bundle is approximately 490 KB raw and 52 KB gzip. This is the lower-bound reference for the next implementation step, not the expected final probe size.
          MD

      - name: Install dependencies
        run: npm ci

      - name: Compile and run focused tests
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npx jest \
            test/network_probe_contract.test.ts \
            test/aether_client_known_servers.test.ts \
            test/aether_client_parallel_connections.test.ts \
            test/ping_attempt_token.test.ts \
            test/ping_rtt_history.test.ts \
            --runInBand

      - name: Build and measure all browser baselines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/network-probe-foundation
          npx webpack --config webpack.config.mjs --env buildTarget=browser --profile --json=/tmp/network-probe-foundation/universal-stats.json
          cp build/browser/aether-client.min.js /tmp/network-probe-foundation/aether-client-universal.min.js
          npx webpack --config webpack.protocol-probe.config.mjs --profile --json=/tmp/network-probe-foundation/protocol-stats.json
          cp build/protocol-probe/aether-protocol-probe.min.js /tmp/network-probe-foundation/aether-protocol-probe.min.js
          npx webpack --config webpack.network-probe.config.mjs --profile --json=/tmp/network-probe-foundation/network-probe-stats.json
          cp build/network-probe/aether-network-probe.min.js /tmp/network-probe-foundation/aether-network-probe.min.js

          python3 - <<'PY'
          from pathlib import Path
          import gzip, json
          root=Path('/tmp/network-probe-foundation')
          def meta(name):
              d=(root/name).read_bytes()
              return {'bytes':len(d),'gzip9Bytes':len(gzip.compress(d,9))}
          out={
              'universal':meta('aether-client-universal.min.js'),
              'protocolSubset':meta('aether-protocol-probe.min.js'),
              'networkProbeFoundation':meta('aether-network-probe.min.js'),
              'reference':{
                  'universalBytes':1376158,
                  'verifiedProtocolRuntimeBytes':489838,
                  'verifiedProtocolRuntimeGzip9Bytes':51494,
              }
          }
          (root/'summary.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          if out['universal']['bytes'] != 1376158:
              raise SystemExit('Universal browser bundle changed unexpectedly')
          if out['protocolSubset']['bytes'] > 550000 or out['protocolSubset']['gzip9Bytes'] > 65000:
              raise SystemExit('Decoupled protocol bundle regressed')
          if out['networkProbeFoundation']['bytes'] > 550000 or out['networkProbeFoundation']['gzip9Bytes'] > 65000:
              raise SystemExit('Network probe foundation already exceeds protocol-floor budget')
          PY

      - name: Verify excluded heavy dependencies stay out of probe foundation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          stats=json.loads(Path('/tmp/network-probe-foundation/network-probe-stats.json').read_text())
          names=[]
          def walk(m):
              children=m.get('modules') or []
              if children:
                  for c in children: walk(c)
              else:
                  names.append(m.get('name') or m.get('identifier') or '')
          for m in stats.get('modules') or []: walk(m)
          forbidden={
              'fullClient': 'aether_client.ts',
              'sodium': 'node_modules/libsodium/',
              'sodiumWrappers': 'libsodium-wrappers',
              'messageNode': 'aether_client_message',
              'webrtc': 'aether_fastmeta_webrtc',
          }
          found={k:any(token in n for n in names) for k,token in forbidden.items()}
          print(json.dumps({'forbiddenDependenciesPresent':found,'moduleCount':len(set(names))},indent=2))
          if any(found.values()):
              raise SystemExit('Heavy dependency leaked into network-probe foundation')
          PY

      - name: Commit validated foundation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-network-probe-foundation.yml
          git config user.name 'Gorynych'
          git config user.email '48762816+StevenMagnet@users.noreply.github.com'
          git add \
            generator/aether_protocol_generator.ts \
            src/aether_protocol_runtime.ts \
            src/aether_api.ts \
            src/aether_api_impl.ts \
            src/aether_browser_protocol_probe.ts \
            src/aether_network_probe_contract.ts \
            src/aether_browser_network_probe.ts \
            webpack.network-probe.config.mjs \
            test/network_probe_contract.test.ts \
            docs/network-probe-test-plan.md \
            .github/workflows/apply-network-probe-foundation.yml
          git commit -m 'Establish lightweight protocol runtime and network probe foundation'
          git push origin HEAD:browser-lite-analysis-20260902
