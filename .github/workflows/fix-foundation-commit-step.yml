name: Fix network probe foundation commit step

on:
  push:
    branches:
      - browser-lite-analysis-20260902
    paths:
      - '.github/workflows/fix-foundation-commit-step.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: browser-lite-analysis-20260902
          fetch-depth: 1
      - name: Patch validated foundation workflow and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply-network-probe-foundation.yml')
          s=p.read_text(encoding='utf-8')
          start=s.find("          git add \\\n            generator/aether_protocol_generator.ts")
          end=s.find("          git commit -m 'Establish lightweight protocol runtime and network probe foundation'", start)
          if start < 0 or end < 0:
              raise SystemExit('Explicit git add block not found')
          s=s[:start] + "          git add -A\n" + s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/fix-foundation-commit-step.yml
          git config user.name 'Gorynych'
          git config user.email '48762816+StevenMagnet@users.noreply.github.com'
          git add -A
          git commit -m 'Fix network probe foundation commit staging'
          git push origin HEAD:browser-lite-analysis-20260902
