name: Compare Jest baselines

on:
  push:
    branches:
      - network-probe-live-prototype-20260902
    paths:
      - '.github/workflows/compare-jest-baselines.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: network-probe-live-prototype-20260902

      - name: Clone three code states
        run: |
          git clone --depth 1 --branch main https://github.com/aethernetio/client-ts.git /tmp/client-main
          git clone --depth 1 --branch browser-lite-analysis-20260902 https://github.com/aethernetio/client-ts.git /tmp/client-foundation
          git clone --depth 1 --branch network-probe-live-prototype-20260902 https://github.com/aethernetio/client-ts.git /tmp/client-probe

      - name: Run exact failing suites on each state
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p jest-baseline-comparison
          for spec in \
            'main:/tmp/client-main' \
            'foundation:/tmp/client-foundation' \
            'probe:/tmp/client-probe'
          do
            name="${spec%%:*}"
            dir="${spec#*:}"
            echo "=== $name ==="
            cd "$dir"
            npm ci >/tmp/npm-ci-$name.log 2>&1 || { cat /tmp/npm-ci-$name.log; exit 1; }
            set +e
            npx jest \
              test/aether_client_parent_selection.test.ts \
              test/aether_fastmeta.concurrent-send-lock.test.ts \
              test/aether_fastmeta.cache.test.ts \
              test/aether_client_registration_retry.test.ts \
              --runInBand \
              --json \
              --outputFile="/tmp/$name.json" \
              >"/tmp/$name.log" 2>&1
            code=$?
            set -e
            cp "/tmp/$name.json" "$GITHUB_WORKSPACE/jest-baseline-comparison/$name.json"
            cp "/tmp/$name.log" "$GITHUB_WORKSPACE/jest-baseline-comparison/$name.log"
            echo "$code" > "$GITHUB_WORKSPACE/jest-baseline-comparison/$name.exit"
          done

      - name: Compare exact failed test names
        run: |
          node - <<'JS'
          const fs=require('fs');
          const root='jest-baseline-comparison';
          const states=['main','foundation','probe'];
          const out={};
          for(const state of states){
            const j=JSON.parse(fs.readFileSync(`${root}/${state}.json`,'utf8'));
            const failed=[];
            for(const suite of j.testResults || []){
              for(const a of suite.assertionResults || []){
                if(a.status==='failed') failed.push({file:suite.name.split('/').pop(),title:a.fullName});
              }
            }
            failed.sort((a,b)=>(a.file+'\0'+a.title).localeCompare(b.file+'\0'+b.title));
            out[state]={
              numFailedTestSuites:j.numFailedTestSuites,
              numFailedTests:j.numFailedTests,
              failed
            };
          }
          const key=x=>`${x.file}::${x.title}`;
          const main=new Set(out.main.failed.map(key));
          const foundation=new Set(out.foundation.failed.map(key));
          const probe=new Set(out.probe.failed.map(key));
          out.comparison={
            probeOnly:[...probe].filter(x=>!foundation.has(x) && !main.has(x)),
            foundationOnlyVsProbe:[...foundation].filter(x=>!probe.has(x)),
            mainOnlyVsProbe:[...main].filter(x=>!probe.has(x)),
            probeEqualsFoundation:probe.size===foundation.size && [...probe].every(x=>foundation.has(x)),
            probeEqualsMain:probe.size===main.size && [...probe].every(x=>main.has(x))
          };
          fs.writeFileSync(`${root}/summary.json`,JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          if(out.comparison.probeOnly.length) {
            throw new Error(`Probe adds ${out.comparison.probeOnly.length} failing tests`);
          }
          JS

      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-baseline-comparison
          path: jest-baseline-comparison
          if-no-files-found: error
