name: Finalize network probe foundation

on:
  push:
    branches:
      - browser-lite-analysis-20260902
    paths:
      - '.github/workflows/finalize-network-probe-foundation.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: browser-lite-analysis-20260902
          fetch-depth: 1

      - name: Prepare validated foundation files
        shell: bash
        run: |
          set -euo pipefail
          # Repair the one local transcription typo and assert the intended generator dependency.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('generator/aether_protocol_generator.ts')
          s=p.read_text(encoding='utf-8')
          bad="processPotentialAnon([fieldName, dtoName], fieldType)"
          good="processFieldType([fieldName, dtoName], fieldType)"
          if bad in s:
              s=s.replace(bad,good,1)
          if "this.importPrefix = './aether_protocol_runtime';" not in s:
              raise SystemExit('Generator is not pointed at narrow protocol runtime')
          p.write_text(s,encoding='utf-8')
          PY

          cat > src/aether_protocol_runtime.ts <<'TS'
          /** Internal runtime surface used by generated protocol code. */
          export * from './aether_future';
          export * from './aether_datainout';
          export * from './aether_fastmeta';
          export * from './aether_types';
          export * from './aether_astring';
          TS

          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/aether_browser_protocol_probe.ts')
          s=p.read_text(encoding='utf-8')
          s=s.replace("export { UUID, URI } from './aether_types';", "export { UUID } from './aether_types';\nexport type { URI } from './aether_types';")
          p.write_text(s,encoding='utf-8')
          PY

          cat > src/aether_network_probe_contract.ts <<'TS'
          import type { IpInfo, ServerDescriptor, ServerDescriptorWithGeo } from './aether_api';

          /** Experimental browser-only contract. Not part of the normal SDK barrel. */
          export const NETWORK_PROBE_IMPLEMENTATION_STAGE = 'foundation' as const;

          export interface NetworkProbeStageTimings {
              stateRestoreMs: number;
              connectMs: number;
              serverListMs: number;
              myIpMs: number;
              firstWorkConnectionMs: number;
              firstPingMs: number;
              allPingsMs: number;
          }

          export interface NetworkProbeSnapshot {
              knownServers: readonly ServerDescriptor[];
              servers: readonly ServerDescriptorWithGeo[];
              myIp: IpInfo | null;
              pingMsBySid: Readonly<Record<number, number>>;
          }

          export interface AetherNetworkProbeClientContract {
              connect(): Promise<void>;
              getKnownServerDescriptors(): readonly ServerDescriptor[];
              getServers(): Promise<readonly ServerDescriptorWithGeo[]>;
              getMyIp(): Promise<IpInfo>;
              connectServers(descriptors: readonly ServerDescriptor[]): Promise<void>;
              measureServerPingMs(sid: number): Promise<number>;
              destroy(): Promise<void>;
          }
          TS

          cat > src/aether_browser_network_probe.ts <<'TS'
          /** Browser entry reserved for the real lightweight network probe. */
          export { NETWORK_PROBE_IMPLEMENTATION_STAGE } from './aether_network_probe_contract';
          export type {
              AetherNetworkProbeClientContract,
              NetworkProbeSnapshot,
              NetworkProbeStageTimings,
          } from './aether_network_probe_contract';
          export {
              AetherCodec,
              CryptoLib,
              ServerDescriptor,
              ServerDescriptorWithGeo,
              IpInfo,
              Cloud,
              LoginApi,
              LoginStream,
              AuthorizedApi,
              ClientApiSafe,
              ClientApiUnsafe,
          } from './aether_api';
          export { UUID } from './aether_types';
          export type { URI } from './aether_types';
          TS

          cat > webpack.network-probe.config.mjs <<'JS'
          import { resolve } from 'path';
          import { fileURLToPath } from 'url';
          import { dirname } from 'path';
          import baseFactory from './webpack.config.mjs';
          const __filename = fileURLToPath(import.meta.url);
          const __dirname = dirname(__filename);
          export default async () => {
            const base = await baseFactory({ buildTarget: 'browser' });
            return {
              ...base,
              entry: { browser: './src/aether_browser_network_probe.ts' },
              output: {
                ...base.output,
                path: resolve(__dirname, 'build/network-probe'),
                filename: 'aether-network-probe.min.js',
                clean: true,
                library: { name: 'AetherNetworkProbe', type: 'window' }
              }
            };
          };
          JS

          cat > test/network_probe_contract.test.ts <<'TS'
          import { NETWORK_PROBE_IMPLEMENTATION_STAGE } from '../src/aether_network_probe_contract';
          describe('network probe foundation', () => {
              it('is explicitly a foundation until live transport is implemented', () => {
                  expect(NETWORK_PROBE_IMPLEMENTATION_STAGE).toBe('foundation');
              });
          });
          TS

          mkdir -p docs
          cat > docs/network-probe-test-plan.md <<'MD'
          # AetherNetworkProbeClient browser test plan

          ## Goal
          Build a browser-only network-observation client for the website use case without importing the full `AetherCloudClient` feature surface. Keep the existing wire protocol, generated metadata, persisted state format and Sodium cryptographic behavior.

          ## Required live path
          1. Restore browser state or perform first registration.
          2. Establish the Æthernet connection.
          3. Return cached server descriptors when available.
          4. Refresh the authoritative server list.
          5. Obtain the public IP through the existing Æthernet API.
          6. Start WORK-server transports in parallel.
          7. Measure RTT for each selected WORK server.
          8. Persist warm-start state.
          9. Destroy transports and timers cleanly.

          ## Explicit exclusions for the first probe
          - `AetherCloudClient`
          - `aether_client_message`
          - WebRTC / `aether_fastmeta_webrtc`
          - access-group and client-to-client messaging behavior unless proven mandatory for login

          Crypto, state, registration and WORK-connection modules may be reused when required by the protocol. Their cost must be measured rather than hidden.

          ## Comparative benchmark
          Run the universal browser client and the probe in the same environment. Use at least 5 cold and 5 warm samples at normal CPU and 4x throttling. Record raw/gzip bytes, script load+evaluate, Sodium readiness, state restore, connect, getServers, getMyIp, first writable WORK connection, first ping, all pings, long-task count and long-task duration.

          ## Acceptance
          A result counts only if the probe reaches the same live network data as the universal client: usable persisted identity/state, authoritative server list, public-IP response, writable WORK transport and successful RTT measurements. It must be materially smaller than the universal browser bundle and must not regress median cold/warm startup.

          ## Current lower bound
          Protocol/runtime-only code is approximately 490 KB raw and 52 KB gzip before crypto and transports. This is a floor for the next implementation, not a final size target.
          MD

      - name: Validate foundation
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npx jest test/network_probe_contract.test.ts test/aether_client_known_servers.test.ts test/aether_client_parallel_connections.test.ts test/ping_attempt_token.test.ts test/ping_rtt_history.test.ts --runInBand
          mkdir -p /tmp/foundation
          npx webpack --config webpack.config.mjs --env buildTarget=browser --profile --json=/tmp/foundation/universal.json
          cp build/browser/aether-client.min.js /tmp/foundation/universal.js
          npx webpack --config webpack.protocol-probe.config.mjs --profile --json=/tmp/foundation/protocol.json
          cp build/protocol-probe/aether-protocol-probe.min.js /tmp/foundation/protocol.js
          npx webpack --config webpack.network-probe.config.mjs --profile --json=/tmp/foundation/probe.json
          cp build/network-probe/aether-network-probe.min.js /tmp/foundation/probe.js
          python3 - <<'PY'
          from pathlib import Path
          import gzip,json
          root=Path('/tmp/foundation')
          def size(n):
              b=(root/n).read_bytes(); return len(b),len(gzip.compress(b,9))
          u=size('universal.js'); p=size('protocol.js'); n=size('probe.js')
          print(json.dumps({'universal':u,'protocol':p,'probeFoundation':n},indent=2))
          if u[0] != 1376158: raise SystemExit('Universal bundle changed')
          if p[0] > 550000 or p[1] > 65000: raise SystemExit('Protocol subset regressed')
          if n[0] > 550000 or n[1] > 65000: raise SystemExit('Probe foundation exceeds floor budget')
          stats=json.loads((root/'probe.json').read_text())
          names=[]
          def walk(m):
              c=m.get('modules') or []
              if c:
                  for x in c: walk(x)
              else: names.append(m.get('name') or m.get('identifier') or '')
          for m in stats.get('modules') or []: walk(m)
          forbidden=['aether_client.ts','node_modules/libsodium/','libsodium-wrappers','aether_client_message','aether_fastmeta_webrtc']
          leaks=[x for x in forbidden if any(x in n for n in names)]
          if leaks: raise SystemExit('Heavy dependencies leaked: '+','.join(leaks))
          PY

      - name: Commit foundation code only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gorynych'
          git config user.email '48762816+StevenMagnet@users.noreply.github.com'
          git add generator/aether_protocol_generator.ts src/aether_protocol_runtime.ts src/aether_browser_protocol_probe.ts src/aether_network_probe_contract.ts src/aether_browser_network_probe.ts webpack.network-probe.config.mjs test/network_probe_contract.test.ts docs/network-probe-test-plan.md
          git commit -m 'Establish lightweight protocol runtime and network probe foundation'
          git push origin HEAD:browser-lite-analysis-20260902
