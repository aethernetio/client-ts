name: Production state and soak validation

on:
  push:
    branches:
      - network-probe-live-prototype-20260902
    paths:
      - '.github/workflows/continue-final-live-probe-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: network-probe-live-prototype-20260902

      - name: Install dependencies and browser runner
        run: |
          npm ci
          npm install --no-save puppeteer-core@24.16.0

      - name: Compile and run probe regressions
        run: |
          npm run build
          npx jest \
            test/network_probe_contract.test.ts \
            test/aether_client_known_servers.test.ts \
            test/aether_client_parallel_connections.test.ts \
            test/ping_attempt_token.test.ts \
            test/ping_rtt_history.test.ts \
            --runInBand

      - name: Build universal and probe
        run: |
          mkdir -p production-soak-validation build/production
          npx webpack --config webpack.config.mjs --env buildTarget=browser --profile --json=production-soak-validation/universal-stats.json
          cp build/browser/aether-client.min.js production-soak-validation/universal.js
          npx webpack --config webpack.network-probe.config.mjs --profile --json=production-soak-validation/probe-stats.json
          cp build/network-probe/aether-network-probe.min.js production-soak-validation/probe-main.js

      - name: Fetch live website production client
        run: |
          curl -fL --retry 3 \
            'https://aethernet.io/aether-client.min.js?v=20260816-browser-v3' \
            -o build/production/aether-client.min.js
          size=$(wc -c < build/production/aether-client.min.js)
          echo "production_size=$size"
          test "$size" -eq 1334301
          sha256sum build/production/aether-client.min.js | tee production-soak-validation/production-client.sha256

      - name: Recheck dependency isolation
        run: |
          python3 - <<'PY'
          import gzip,json
          from pathlib import Path
          root=Path('production-soak-validation')
          stats=json.loads((root/'probe-stats.json').read_text())
          universal=(root/'universal.js').read_bytes()
          probe=(root/'probe-main.js').read_bytes()
          entry=stats.get('entrypoints',{}).get('browser',{})
          entry_chunks=set(entry.get('chunks') or [])
          initial=[]; all_names=[]
          def walk(m):
              children=m.get('modules') or []
              if children:
                  for c in children: walk(c)
                  return
              name=m.get('name') or m.get('identifier') or ''
              all_names.append(name)
              if set(m.get('chunks') or []) & entry_chunks: initial.append(name)
          for m in stats.get('modules') or []: walk(m)
          forbidden={
              'fullClient':'aether_client.ts',
              'oldWork':'aether_client_connection_work.ts',
              'messageNode':'aether_client_message',
              'webrtc':'aether_fastmeta_webrtc',
              'sodium':'node_modules/libsodium/',
              'sodiumWrappers':'libsodium-wrappers',
              'bcrypt':'bcryptjs',
          }
          leaks={k:any(token in n for n in initial) for k,token in forbidden.items()}
          assets=[]
          for p in sorted(Path('build/network-probe').glob('*.js')):
              data=p.read_bytes()
              assets.append({'name':p.name,'bytes':len(data),'gzip9Bytes':len(gzip.compress(data,9))})
          report={
              'universalBytes':len(universal),
              'probeMainBytes':len(probe),
              'probeMainGzip9Bytes':len(gzip.compress(probe,9)),
              'assets':assets,
              'forbiddenInitialDependencies':leaks,
              'deferredSodium':any('libsodium' in n for n in all_names),
              'deferredRegistration':any('aether_network_probe_connection_registration' in n for n in all_names),
          }
          print(json.dumps(report,indent=2))
          (root/'static-summary.json').write_text(json.dumps(report,indent=2))
          if len(universal)!=1376158: raise SystemExit('Universal build changed')
          if any(leaks.values()): raise SystemExit('Forbidden dependency leaked into initial probe chunk')
          if not report['deferredSodium'] or not report['deferredRegistration']:
              raise SystemExit('Deferred chunks missing')
          if len(probe)>=len(universal): raise SystemExit('Probe main chunk is not smaller')
          PY

      - name: Run exact production state compatibility and soak
        run: |
          node scripts/run-network-probe-compat-soak.mjs production-soak-validation/compat-soak.json

      - name: Upload production state and soak validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-state-and-soak-validation
          path: production-soak-validation
          if-no-files-found: warn
